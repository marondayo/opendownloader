ShortDescription: Free, open-source video and audio downloader for YouTube, Niconico, Bilibili and SoundCloud.
Description: |-
  OpenDownloader downloads video and audio from YouTube, Niconico, Bilibili and SoundCloud, including playlists, channels and Bilibili multi-part videos.
  Video up to 8K (MP4/MKV/WEBM) or audio (MP3, M4A, OGG, OPUS, FLAC, WAV) with cover art and tags.
  Subscriptions download new uploads automatically, and Bilibili danmaku and Niconico comments are saved as subtitles.
  It also includes a media converter and keeps itself and its components (yt-dlp, FFmpeg, Deno) up to date.
