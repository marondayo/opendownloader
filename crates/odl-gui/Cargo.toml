[package]
name = "odl-gui"
description = "OpenDownloader: a free, open-source video & audio downloader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "opendownloader"
path = "src/main.rs"

[dependencies]
odl-core = { path = "../odl-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.36", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.17"
tokio-util = "0.7"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
fontdb = "0.24"
qrcode = { version = "0.14", default-features = false }
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
